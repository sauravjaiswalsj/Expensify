spring:
  application:
    name: <your-application-name>
  data:
    mongodb:
      uri: <your-mongodb-uri>
      database: <your-database-name>
      auto-index-creation: true
  main:
    log-startup-info: false

server:
  port: 8080 #<your-port-number>

ai:
  xai:
    api-key: ${XAI_API_KEY:}
    model: ${XAI_MODEL:grok-4-fast-non-reasoning}
    responses-url: ${XAI_RESPONSES_URL:https://api.x.ai/v1/responses}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:220}
    max-expenses: ${AI_MAX_EXPENSES:40}

logging:
  level:
    root: #<your-log-level>

springdoc:
  show-login-endpoint: true
