spring:
  application:
    name: <your-application-name>
  data:
    mongodb:
      uri: <your-mongodb-uri>
      database: <your-database-name>
      auto-index-creation: true
  main:
    log-startup-info: false

server:
  port: 8080 #<your-port-number>

ai:
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-5.4-mini}
    responses-url: ${OPENAI_RESPONSES_URL:https://api.openai.com/v1/responses}
    max-output-tokens: ${OPENAI_MAX_OUTPUT_TOKENS:220}
    max-expenses: ${AI_MAX_EXPENSES:40}

logging:
  level:
    root: #<your-log-level>

springdoc:
  show-login-endpoint: true
