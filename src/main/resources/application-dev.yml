spring:
  config:
    import: "optional:file:.env[.properties]"

  application:
    name: money
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI}
      database: ${SPRING_DATASOURCE_DATABASE}
      auto-index-creation: true
  main:
    log-startup-info: true

  mail:
    username: ${SUPPORT_EMAIL}
    password: ${APP_PASSWORD}
    host: smtp.gmail.com
    port: 587
    protocol: smtp
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.debug: false

security:
  jwt:
    secret-key: ${JWT_SECRET_KEY}
    expiration: 3600000

ai:
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-5.4-mini}
    responses-url: ${OPENAI_RESPONSES_URL:https://api.openai.com/v1/responses}
    max-output-tokens: ${OPENAI_MAX_OUTPUT_TOKENS:220}
    max-expenses: ${AI_MAX_EXPENSES:40}

server:
  port: 8080

logging:
  level:
    root: INFO
    com.tracker.expenses.money: DEBUG
    org.springframework.web: INFO
    org.springframework.data.mongodb: DEBUG
    com.mongodb: DEBUG

